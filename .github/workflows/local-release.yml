name: Local Release

# Se dispara al crear un tag local-vX.Y.Z (ej: local-v1.0.0).
# Compila el instalador de Windows de la edicion "Sistema POS Local"
# (standalone, nunca sincroniza -- ver src-tauri-local/) y lo deja como
# artifact del workflow para que el super_admin lo descargue y se lo
# entregue A MANO al cliente que pagó esa actualización -- esta edicion
# a proposito NO tiene actualizaciones automaticas (sin tauri-plugin-
# updater, ver src-tauri-local/src/lib.rs), asi que no hay manifiesto ni
# firma que generar ni publicar en el droplet.
# Calcado de turion-release.yml -- ver ese archivo para el detalle de cada
# paso, aca solo se anota lo que cambia entre ediciones.
on:
  push:
    tags:
      - 'local-v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer version del tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/local-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fijar version en tauri.conf.json
        shell: pwsh
        run: |
          $path = "src-tauri-local/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = "${{ steps.version.outputs.version }}"
          $json | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - name: Instalar dependencias de Composer (produccion)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm y compilar assets
        run: |
          npm ci
          npm run build

      # src-tauri-local/tauri.conf.json apunta a ../src-tauri/binaries/php/
      # runtime (el mismo runtime que usa Turion) para no duplicar esta
      # descarga de ~75MB en cada edicion -- el script sigue escribiendo
      # ahi, no en src-tauri-local/.
      - name: Preparar runtime de PHP portable (compartido con Turion)
        shell: bash
        run: bash scripts/setup-php-portable.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri-local

      - name: Compilar Sistema POS Local
        shell: pwsh
        run: npm run tauri:build:local:prod

      - name: Ubicar el instalador generado
        id: instalador
        shell: pwsh
        run: |
          $bundleDir = "src-tauri-local/target/release/bundle/nsis"
          $instalador = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          echo "installer_path=$($instalador.FullName)" >> $env:GITHUB_OUTPUT

      - name: Guardar instalador como artifact (entrega manual al cliente)
        uses: actions/upload-artifact@v4
        with:
          name: sistema-pos-local-${{ steps.version.outputs.version }}
          path: ${{ steps.instalador.outputs.installer_path }}

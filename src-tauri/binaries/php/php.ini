; php.ini del PHP portable que Turion empaca como sidecar. Basado en las
; recomendaciones de php.ini-production, ajustado para correr Laravel
; localmente (servidor embebido de PHP + SQLite) sin instalacion de PHP en
; el sistema del usuario. Ver src-tauri/binaries/php/README.md.

extension_dir = "ext"

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip

zend_extension=opcache
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=128

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M
max_input_vars = 5000

date.timezone = America/Bogota

display_errors = Off
log_errors = On

expose_php = Off

; windows.php.net no trae un paquete de certificados CA (a diferencia de
; Linux, que usa el almacen del sistema) -- sin esto, CUALQUIER llamada
; HTTPS saliente (emparejar, sincronizar, subir al droplet) falla con
; "cURL error 60: SSL certificate ... unable to get local issuer
; certificate". cacert.pem es el paquete oficial de Mozilla que distribuye
; curl.se, copiado junto a este php.ini por setup-php-portable.sh.
;
; Estas dos rutas son relativas al directorio de trabajo del proceso, que
; varia (public/ para el servidor, la raiz del proyecto para artisan) --
; Turion (src-tauri/src/lib.rs) las sobreescribe con la ruta absoluta real
; via "-d" al lanzar php.exe. Se dejan aqui solo como respaldo por si se
; corre el sidecar manualmente sin pasar por Turion.
curl.cainfo = "cacert.pem"
openssl.cafile = "cacert.pem"

; Bajo el SAPI "cli-server" (el que usa "php -S", nuestro servidor local)
; PHP trae implicit_flush=On y output_buffering=0 por defecto -- eso hace
; que las cookies de sesion (y el token CSRF) nunca lleguen al navegador:
; en cuanto se manda el primer byte de la vista, PHP ya "cerro" los
; headers de la respuesta (headers_sent()=true) ANTES de que Laravel
; alcance a adjuntar el Set-Cookie en su propio Response->send(). Sin
; esto, CUALQUIER formulario del POS local revienta con error 419.
output_buffering = 4096
implicit_flush = Off

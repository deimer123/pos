; php.ini del PHP portable que Turion empaca como sidecar. Basado en las
; recomendaciones de php.ini-production, ajustado para correr Laravel
; localmente (servidor embebido de PHP + SQLite) sin instalacion de PHP en
; el sistema del usuario. Ver src-tauri/binaries/php/README.md.

extension_dir = "ext"

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip

zend_extension=opcache
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=128

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M
max_input_vars = 5000

date.timezone = America/Bogota

display_errors = Off
log_errors = On

expose_php = Off

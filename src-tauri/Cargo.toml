[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# opt-level/lto/codegen-units mas conservadores que el default de Cargo:
# con los valores normales de release, esta version de Rust (1.97.1) falla
# al compilar crates de proc-macro (derive_more-impl, phf_macros) que Tauri
# necesita, con "crate proc_macro required to be available in rlib format,
# but was not found in this form" -- parece una regresion del compilador
# especifica de esta version muy reciente, combinada con crate-type
# staticlib+cdylib+rlib. Bajar la optimizacion evita el camino de codigo
# que dispara el error.
[profile.release]
opt-level = 1
lto = false
codegen-units = 16
panic = "unwind"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Tauri devuelve resource_dir()/app_data_dir() ya canonicalizados, lo que en
# Windows agrega el prefijo de ruta extendida "\\?\". CreateProcess con una
# ruta de ejecutable en ese formato hace que php.exe se caiga con
# STATUS_ACCESS_VIOLATION al arrancar (visto en la practica) -- dunce le
# quita ese prefijo cuando no hace falta.
dunce = "1.0"

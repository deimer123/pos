[package]
name = "app"
version = "0.1.0"
description = "Sistema POS Local"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Mismo ajuste que src-tauri/Cargo.toml (ver el comentario alla): opt-level
# mas bajo evita una regresion del compilador al compilar crates de
# proc-macro que Tauri necesita.
[profile.release]
opt-level = 1
lto = false
codegen-units = 16
panic = "unwind"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dunce = "1.0"
# Hash del fingerprint de maquina (MachineGuid de Windows) -- ver
# machine_id() en lib.rs, obligatorio en esta edicion para la activacion.
sha2 = "0.10"
